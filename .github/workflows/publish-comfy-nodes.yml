# Publishes the ComfyUI node pack (comfy-nodes/) to the Comfy Registry.
# Manual only: it runs when someone starts it from the Actions tab, never on a push.
# Needs the repository secret REGISTRY_ACCESS_TOKEN, and the placeholders of
# comfy-nodes/pyproject.toml filled in: PublisherId, and OWNER in the URLs
# (see comfy-nodes/README.md, "Publishing").
name: Publish ComfyUI node pack

on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stops before anything is sent while a placeholder is left in pyproject.toml
      - name: Check the placeholders
        working-directory: comfy-nodes
        run: |
          if grep -nE 'YOUR-PUBLISHER-ID|github\.com/OWNER/|githubusercontent\.com/OWNER/' pyproject.toml; then
            echo "Fill in PublisherId and replace OWNER in comfy-nodes/pyproject.toml before publishing." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pinned: this job holds the Registry token
      - run: pip install comfy-cli==1.22.0
      - run: comfy --skip-prompt --no-enable-telemetry env
      # the token reaches the shell through the environment, never pasted into the command line
      - run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
        working-directory: comfy-nodes
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
