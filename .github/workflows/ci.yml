name: CI

on:
  push:
  pull_request:

# The jobs only read the code: the token of a run can change nothing in the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The newest 22.x, not the one cached on the runner: security releases land there first.
          check-latest: true
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w @montagio/web
      - run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r comfy-nodes/requirements-dev.txt
      - run: npm run test:nodes
        env:
          MONTAGIO_REQUIRE_TS_PARITY: '1'
      - run: npm run check:open-stack
      # The proof the Open Stack page shows, kept with each run: every model, weight file and licence.
      - uses: actions/upload-artifact@v7
        with:
          name: open-stack-report
          path: apps/web/public/open-stack-report.json
      # The showcase manifest, its sample photos and its rendered clips (sha256, mention, workflow).
      - run: npm run showcase -- verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The newest 22.x, not the one cached on the runner: security releases land there first.
          check-latest: true
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @montagio/web
      - run: npm run e2e:local -w @montagio/web
