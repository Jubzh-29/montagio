# Speech for the talking avatar (extension "avatar"): what the avatar says, in English or
# French, in the model's built-in voice, or in the voice of a sample (node 4, given with the
# speaker's consent; compileSpeech removes it otherwise). ComfyUI v0.41.0 has no local text-to-speech node:
# this one comes from wildminder/ComfyUI-Chatterbox, pinned and patched (its HTTP routes
# removed) by infra/runpod/bootstrap.sh, with ComfyUI kept offline. The weights sit in a
# pack folder the node reads by name (tts/chatterbox/resembleai-mtl-v3).
schema: montagio/extension-model@0.1
id: chatterbox-mtl-voice
name: Chatterbox Multilingual V3 (avatar voice)
extension: avatar
task: tts
license: MIT
weights: [chatterbox-t3-mtl-v3, chatterbox-s3gen, chatterbox-ve, chatterbox-conds, chatterbox-grapheme-mtl, chatterbox-cangjie]
workflow: workflows/chatterbox-mtl-voice.api.json
bindings:
  text: { node: "2", field: text }
  language: { node: "2", field: language }
  seed: { node: "2", field: seed }
  cfg: { node: "2", field: cfg_weight }
  # the voice sample to speak with: mono FLAC, 20 s at most
  audio: { node: "4", field: audio }
output: { node: "3", kind: audio }
# about 15 s of speech, the longest the avatar animates
limits: { max_chars: 300 }
# GPU seconds for 15 s of speech on an RTX 4090. Session S2, on an L4 (about half as fast):
# 2.5 to 5.2 s warm for 3 to 4 s of speech, 14 s with the model loading
estimate_s: 15
