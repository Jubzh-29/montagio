# Film music (extension "music"): an instrumental soundtrack for a Sequence, mixed under
# the film by packages/sequence (mixMusic). ACE-Step documents 10 to 600 s; a film of
# 3 shots lasts 15 s at most, so a shorter film gets 10 s of music, cut with a fade.
schema: montagio/extension-model@0.1
id: ace-step15-music
name: ACE-Step 1.5 (film music)
extension: music
task: t2a
license: MIT
weights: [ace-step15-turbo, qwen3-embedding-06b-ace15, ace-step15-lm-17b, ace-step15-vae]
workflow: workflows/ace-step15-music.api.json
bindings:
  prompt: { node: "94", field: tags }
  # The latent length and the LM's code count both follow the duration, and the template
  # drives the KSampler and the LM from one seed: each value goes to two inputs.
  duration_s: [{ node: "98", field: seconds }, { node: "94", field: duration }]
  seed: [{ node: "3", field: seed }, { node: "94", field: seed }]
  bpm: { node: "94", field: bpm }
output: { node: "107", kind: audio }
limits: { min_duration_s: 10, max_duration_s: 60, max_chars: 300 }
# GPU seconds for 15 to 60 s of music on an RTX 4090 (estimate; S2 measures it)
estimate_s: 20
