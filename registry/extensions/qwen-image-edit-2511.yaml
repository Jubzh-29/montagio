# Image edit (extension "edit"): the start photo of a shot changed by an instruction
# ("make it night", "remove the car") before it is animated, or the end frame of a
# keyframe transition. The edited PNG is about 1 megapixel, at one of the 17 sizes of
# FluxKontextImageScale (16:9 gives 1392x752). The workflow carries the Lightning LoRA
# (171, 4 steps), a look LoRA (170: INFL8, ACTION or angles) and a second image (42,
# an outfit to wear); compileEdit removes and rewires those a job does not use.
schema: montagio/extension-model@0.1
id: qwen-image-edit-2511
name: Qwen-Image-Edit-2511 (photo edit)
extension: edit
task: i2i-edit
license: Apache-2.0
weights:
  - qwen-image-edit-2511-fp8mixed
  - qwen25-vl-7b-fp8
  - qwen-image-vae
  - qwen-edit-2511-lightning-4step
  - systms-infl8-qwen-edit-2511
  - systms-action-qwen-edit-2511
  - fal-multiple-angles-qwen-edit-2511
workflow: workflows/qwen-image-edit-2511.api.json
bindings:
  image: { node: "41", field: image }
  image2: { node: "42", field: image }
  # the positive encoder; the negative one (149) keeps an empty prompt, as in the template
  prompt: { node: "151", field: prompt }
  seed: { node: "169", field: seed }
output: { node: "9", kind: image }
limits: { max_chars: 500 }
# GPU seconds per image on an RTX 4090 with the 4-step LoRA (estimate: 15 to 25 s; about
# 2 min at 40 steps without it; S2 measures both)
estimate_s: 25
