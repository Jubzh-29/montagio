# The ten extensions, in their order of priority, and the day a GPU session validated
# each one (null until then). Their models are in registry/extensions/, apart from the
# camera-preset models of registry/models/. On 2026-10-19 the order was reoriented toward
# one-photo hooks: the image edit first (it also makes the transitions' end frames), the
# effects pack, the keyframe transitions, then the avatar, the music and the upscale.
#
# Cut rule (decided on 2026-10-19): an extension not validated on GPU by the evening
# of 25/10 is hidden from the demo, and so is one whose requirement is hidden. The app
# and the local installer read MONTAGIO_EXTENSIONS: unset or "validated" keeps the
# extensions dated below; "all", "none" or a list such as "edit,transitions" overrides
# it (development, GPU sessions).
schema: montagio/extensions@0.1
extensions:
  - id: edit
    priority: 1
    gpu_validated: 2026-10-21
  - id: effects
    priority: 2
    gpu_validated: 2026-10-21
    # Run on a GPU held to 12 GB: the 12 GB profile (MONTAGIO_VRAM_PROFILE=12gb) offers the extensions dated here.
    low_vram_validated: 2026-10-25
  - id: transitions
    priority: 3
    requires: [edit]
    gpu_validated: 2026-10-21
  - id: avatar
    priority: 4
    gpu_validated: 2026-10-21
  - id: music
    priority: 5
    gpu_validated: 2026-10-21
  - id: upscale
    priority: 6
    gpu_validated: 2026-10-21
  # Motion transfer (2026-10-20): last in priority, under the cut rule like the others.
  - id: motion
    priority: 7
    gpu_validated: 2026-10-21
  # Restyle (2026-10-24): a clip's scene rebuilt around its motion with Wan 2.1 VACE 14B. It needs
  # no other extension: without the edit, a job has no restyled first frame and follows its text.
  # Its three paths ran through the smoke on an L4 on 2026-10-24 (docs/S2_RESULTATS.md, part 16).
  - id: restyle
    priority: 8
    gpu_validated: 2026-10-24
  # Object swap (2026-10-24): an object marked on a clip's first frame, followed through the clip by
  # SAM 2.1 (a pinned third-party node pack, kijai/ComfyUI-segment-anything-2), then replaced by VACE
  # from a photo or a text. It runs on the restyle's weights, so it requires it. Both paths (a photo,
  # the text alone) ran through the smoke on an L4 on 2026-10-25 (docs/S2_RESULTATS.md, part 17).
  - id: swap
    priority: 9
    requires: [restyle]
    gpu_validated: 2026-10-25
  # Trend remix (2026-10-25): a clip of several shots made again shot by shot with the same character,
  # the same references and the same seed, then put back on the same frames. Each shot runs on the
  # motion transfer (and, in the scene, on the object swap when it is shown); the skeleton and the post
  # come from Gemma 4 E4B, within the avatar's weights, when the avatar is shown. It has no model of its own.
  # Validated on an L4 on 2026-10-25: the sample's three shots made again by the sample character, put back
  # on their frames; Gemma read the sheet and wrote the post (docs/S2_RESULTATS.md, part 18).
  - id: remix
    priority: 10
    requires: [motion]
    gpu_validated: 2026-10-25
