schema: montagio/model@0.1
id: wan22-ti2v-5b
name: Wan 2.2 5B
kind: video
tier: fast
capabilities: [i2v]
license: Apache-2.0
weights: [wan22-ti2v-5b, umt5-xxl-fp8, wan22-vae]
workflow: workflows/wan22-ti2v-5b.api.json
bindings:
  image: { node: "56", field: image }
  prompt: { node: "6", field: text }
  negative: { node: "7", field: text }
  seed: { node: "3", field: seed }
  width: { node: "55", field: width }
  height: { node: "55", field: height }
  frames: { node: "55", field: length }
  fps: { node: "57", field: fps }
limits:
  resolutions: [480p, 720p]
  fps: [24]
  max_duration_s: 5
# GPU seconds on an RTX 4090. Session S2, on an L4 (about half as fast): 190 s at 480p with the
# model loading, 508 s at 720p (121 frames at 24 fps)
estimate_s:
  480p: 95
  720p: 250
# The 12 GB profile: measured on 2026-10-25 on an L4 held to 11.5 GiB of free VRAM and 32 GiB of RAM
# (infra/modal, function lowvram), a card in the class of an RTX 4070: its seconds are kept as they are.
# 192.9 s at 480p with the model loading (190 s at 24 GB); 720p was not run there.
low_vram:
  gpu_validated: 2026-10-25
  estimate_s:
    480p: 193
