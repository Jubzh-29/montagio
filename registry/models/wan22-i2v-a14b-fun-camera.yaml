schema: montagio/model@0.1
id: wan22-i2v-a14b-fun-camera
name: Wan 2.2 Fun Camera
kind: video
tier: quality
capabilities: [i2v-camera]
license: Apache-2.0
weights: [wan22-fun-camera-high, wan22-fun-camera-low, umt5-xxl-fp8, wan21-vae]
workflow: workflows/wan22-fun-camera.api.json
bindings:
  image: { node: "97", field: image }
  prompt: { node: "107", field: text }
  negative: { node: "99", field: text }
  seed: { node: "102", field: noise_seed }
  width: { node: "108", field: width }
  height: { node: "108", field: height }
  frames: { node: "108", field: length }
  fps: { node: "105", field: fps }
  camera_pose: { node: "108", field: camera_pose }
  camera_speed: { node: "108", field: speed }
limits:
  resolutions: [480p, 720p]
  fps: [16]
  max_duration_s: 5
# GPU seconds on an RTX 4090. Session S2, on an L4 (about half as fast; the official template states
# 536 s on an RTX 4090D): 1,133 s warm at 480p, 4,331 s at 720p (21.5 GB peak). For HD, 480p then
# the SeedVR2 upscale is about three times faster than rendering 720p.
estimate_s:
  480p: 565
  720p: 2165
