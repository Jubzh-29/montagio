schema: montagio/model@0.1
id: wan22-i2v-a14b-fun-camera
name: Wan 2.2 Fun Camera
kind: video
tier: quality
capabilities: [i2v-camera]
license: Apache-2.0
weights: [wan22-fun-camera-high, wan22-fun-camera-low, umt5-xxl-fp8, wan21-vae]
workflow: workflows/wan22-fun-camera.api.json
bindings:
  image: { node: "3", field: image }
  prompt: { node: "6", field: text }
  negative: { node: "7", field: text }
  seed: { node: "10", field: noise_seed }
  width: { node: "12", field: width }
  height: { node: "12", field: height }
  frames: { node: "12", field: length }
  fps: { node: "16", field: fps }
  camera_pose: { node: "12", field: camera_pose }
  camera_speed: { node: "12", field: speed }
limits:
  resolutions: [480p, 720p]
  fps: [16]
  max_duration_s: 5
estimate_s:
  480p: 120
  720p: 300
