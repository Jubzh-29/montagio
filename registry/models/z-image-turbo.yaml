schema: montagio/model@0.1
id: z-image-turbo
name: Z-Image Turbo
kind: image
tier: fast
capabilities: [t2i]
license: Apache-2.0
weights: [z-image-turbo, qwen3-4b, flux-ae]
workflow: workflows/z-image-turbo.api.json
bindings:
  prompt: { node: "27", field: text }
  seed: { node: "3", field: seed }
  width: { node: "13", field: width }
  height: { node: "13", field: height }
limits:
  resolutions: [480p, 720p]
  fps: [16]
  max_duration_s: 1
# GPU seconds on an RTX 4090. Session S2, on an L4 (about half as fast): 9.1 to 9.6 s warm at
# 1280x720, 45 s with the models loading
estimate_s:
  480p: 3
  720p: 5
# The 12 GB profile: measured on 2026-10-25 on an L4 held to 11.5 GiB of free VRAM and 32 GiB of RAM
# (infra/modal, function lowvram), a card in the class of an RTX 4070: its seconds are kept as they are.
# 48 s for one 1280x720 image with the models loading (45 s at 24 GB, then 9.1 to 9.6 s warm); warm was not run there.
low_vram:
  gpu_validated: 2026-10-25
  estimate_s:
    480p: 12
    720p: 15
