schema: montagio/model@0.1
id: wan22-i2v-a14b-fun-camera-turbo
name: Wan 2.2 Fun Camera Turbo
kind: video
tier: turbo
capabilities: [i2v-camera]
license: Apache-2.0
# The Fun Camera model with the 4-step LoRAs of lightx2v (the template's second group): the same
# camera control, pose by pose, in 4 steps at cfg 1 instead of 20 at cfg 3.5.
weights: [wan22-fun-camera-high, wan22-fun-camera-low, lightx2v-wan22-i2v-4step-high, lightx2v-wan22-i2v-4step-low, umt5-xxl-fp8, wan21-vae]
workflow: workflows/wan22-fun-camera-turbo.api.json
bindings:
  image: { node: "97", field: image }
  prompt: { node: "107", field: text }
  negative: { node: "99", field: text }
  seed: { node: "102", field: noise_seed }
  width: { node: "108", field: width }
  height: { node: "108", field: height }
  frames: { node: "108", field: length }
  fps: { node: "105", field: fps }
  camera_pose: { node: "108", field: camera_pose }
  camera_speed: { node: "108", field: speed }
limits:
  resolutions: [480p]
  fps: [16]
  max_duration_s: 5
# GPU seconds on an RTX 4090. The official template states 71 s warm and 108 s with the models
# loading at 640x640 on an RTX 4090D (536 s at 20 steps).
estimate_s:
  480p: 75
