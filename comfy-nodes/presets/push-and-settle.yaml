# Draft (plan 2b): provisional name and settings, tuned in GPU session S2.
# Note: preset schema v0.1 has no timing; the rhythm lives in the speed and the prompt only.
schema: montagio/preset@0.1
id: push-and-settle
name: Push & Settle
description: Pushes in, then settles and holds on the subject.
preview: previews/push-and-settle.mp4
license: CC-BY-4.0
author: montagio-community
capability: i2v-camera
camera:
  poses: [zoom_in]
  speed: 0.7
prompt:
  suffix: "camera pushes in, then settles and holds still on the subject, cinematic"
  negative: "blurry, distorted, warped faces, extra limbs, flicker, low quality"
defaults:
  duration_s: 5
  resolution: 480p
  fps: 16
models:
  preferred: wan22-i2v-a14b-fun-camera
  fallback: wan22-ti2v-5b
