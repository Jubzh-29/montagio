# Checked on a GPU in session S2 (2026-10-21, L4): clean once a description of the photo comes before this text (docs/S2_RESULTATS.md).
schema: montagio/preset@0.1
id: pull-back-reveal
name: Pull Back Reveal
description: Pulls away to reveal the wider scene around the subject.
preview: previews/pull-back-reveal.mp4
license: CC-BY-4.0
author: montagio-community
capability: i2v-camera
camera:
  poses: [zoom_out]
  speed: 1.0
prompt:
  suffix: "camera pulls back to reveal the wider scene, smooth cinematic dolly out"
  negative: "blurry, distorted, warped faces, extra limbs, flicker, low quality"
defaults:
  duration_s: 5
  resolution: 480p
  fps: 16
models:
  preferred: wan22-i2v-a14b-fun-camera
  fallback: wan22-ti2v-5b
