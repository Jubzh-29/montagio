# Draft (plan 2b): provisional name and settings, tuned in GPU session S2.
# Note: "Pan Up" / "Pan Down" of WanCameraEmbedding move the camera (translation) rather than rotate it; GPU session S1 decides how a tilt renders.
schema: montagio/preset@0.1
id: tilt-up
name: Tilt Up
description: Looks upward to reveal what rises above the subject.
preview: previews/tilt-up.mp4
license: CC-BY-4.0
author: montagio-community
capability: i2v-camera
camera:
  poses: [pan_up]
  speed: 0.8
prompt:
  suffix: "camera tilts up, revealing what rises above, smooth cinematic motion"
  negative: "blurry, distorted, warped faces, extra limbs, flicker, low quality"
defaults:
  duration_s: 5
  resolution: 480p
  fps: 16
models:
  preferred: wan22-i2v-a14b-fun-camera
  fallback: wan22-ti2v-5b
