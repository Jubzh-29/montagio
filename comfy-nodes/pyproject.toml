[project]
name = "montagio"
description = "Camera presets for Wan 2.2 Fun Camera: load a Montagio preset file, and run two camera moves at once or one after the other. Plus Montagio Transcribe Words: the words of a speech with their timing (Whisper), for captions."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "numpy>=1.25.0"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
# Placeholder: replace OWNER with the GitHub account that hosts the repository before
# publishing (README, "Publishing"); the publish workflow refuses to run while it is there.
Repository = "https://github.com/OWNER/montagio"
Documentation = "https://github.com/OWNER/montagio/tree/main/comfy-nodes#readme"
"Bug Tracker" = "https://github.com/OWNER/montagio/issues"

[tool.comfy]
# Placeholder: the publisher id created on https://registry.comfy.org (README, "Publishing").
PublisherId = "YOUR-PUBLISHER-ID"
DisplayName = "Montagio Camera Presets"
# Square SVG, the Montagio mark; the same OWNER placeholder.
Icon = "https://raw.githubusercontent.com/OWNER/montagio/main/docs/brand/montagio-mark.svg"
requires-comfyui = ">=0.41.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the folder name "comfy-nodes" has a dash and is not importable as a package, hence importlib mode
addopts = "--import-mode=importlib"
pythonpath = ["."]
