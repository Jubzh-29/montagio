# Checked on a GPU in session S2 (2026-10-21, L4): clean once a description of the photo comes before this text (docs/S2_RESULTATS.md).
# Note: the two moves run together, through the Montagio Camera Embedding node (comfy-nodes); a preset with one move keeps the core WanCameraEmbedding.
schema: montagio/preset@0.1
id: drift-left-push
name: Drift Left Push
description: Drifts left while easing in toward the subject.
preview: previews/drift-left-push.mp4
license: CC-BY-4.0
author: montagio-community
capability: i2v-camera
camera:
  poses: [pan_left, zoom_in]
  speed: 0.8
prompt:
  suffix: "camera drifts left while easing in, smooth cinematic tracking"
  negative: "blurry, distorted, warped faces, extra limbs, flicker, low quality"
defaults:
  duration_s: 5
  resolution: 480p
  fps: 16
models:
  preferred: wan22-i2v-a14b-fun-camera
  fallback: wan22-ti2v-5b
# Quality (20 steps) by default: a sideways move, like Pan Left whose 4 steps double a person into a ghost (GPU session of 2026-10-25).
