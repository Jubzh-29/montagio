# Effect LoRA: Remade-AI/360-Orbit (Apache-2.0 in the card metadata, no LICENSE file).
# The card has no template, only example prompts; this one follows them. The native Wan 2.2
# orbit of ostris (Apache-2.0) is the alternative, on the transitions' weights.
schema: montagio/preset@0.1
id: full-circle
name: Full Circle
description: The camera circles the subject all the way around.
preview: previews/full-circle.mp4
license: CC-BY-4.0
author: montagio-community
capability: i2v-effect
effect:
  lora: remade-360-orbit
  strength: 1
  trigger: 0rb4it 360 degree orbit
prompt:
  template: "The video shows the {subject}. The camera performs an 0rb4it 360 degree orbit, circling around the {subject} and showing it from every side, before returning to the front view."
  subject: subject
models:
  preferred: wan21-i2v-effects
# Validated on a GPU in session S2 (L4, 4 steps): docs/S2_RESULTATS.md.
gpu_validated: 2026-10-21
