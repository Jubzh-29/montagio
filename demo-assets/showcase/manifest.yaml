# Montagio showcase manifest: the sample photos of the free demo link, and the
# clips really rendered for them. Every preset × sample pair without a clip
# entry gets a placeholder (camera move simulated by FFmpeg, labelled as such).
# Clip entries are written by `npm run showcase -- ingest`; check with
# `npm run showcase -- verify [--strict]`. See README.md and docs/VITRINE.md.
schema: montagio/showcase@0.1
# The model every rendered clip was made with.
model: wan22-i2v-a14b-fun-camera
