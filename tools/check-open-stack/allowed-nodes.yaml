  - { class_type: LoadVideo, source: comfyui-core, license: GPL-3.0 }
  - { class_type: GetVideoComponents, source: comfyui-core, license: GPL-3.0 }
  - { class_type: ResizeImageMaskNode, source: comfyui-core, license: GPL-3.0 }
