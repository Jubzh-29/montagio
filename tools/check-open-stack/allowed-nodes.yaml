  - { class_type: EmptyAceStep1.5LatentAudio, source: comfyui-core, license: GPL-3.0 }
  - { class_type: VAEDecodeAudio, source: comfyui-core, license: GPL-3.0 }
  - { class_type: SaveAudioAdvanced, source: comfyui-core, license: GPL-3.0 }
  # Extension "upscale" (2026-10-19), core of ComfyUI v0.41.0: comfy_extras/nodes_video.py (LoadVideo,
  # GetVideoComponents), comfy_extras/nodes_post_processing.py (ResizeImageMaskNode), nodes.py (VAEEncodeTiled,
