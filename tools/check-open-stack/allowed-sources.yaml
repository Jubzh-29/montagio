# Never a source or a download repository, whatever a template or a tutorial fetches from it.
denied:
  - repo: Kijai/WanVideo_comfy
    reason: no declared license, and it ships a folder under CC BY-NC-SA 4.0 (LoRAs/Ditto); the InfiniteTalk template fetches its LoRA and VAE from it
  - repo: Comfy-Org/HunyuanVideo_1.5_repackaged
    reason: Tencent Hunyuan Community license, which excludes the EU, the UK and South Korea; the Qwen-Image-Edit templates fetch their text encoder from it
  - repo: artificialguybr/*-Redmond-*
    reason: CC0-1.0, outside the Apache-2.0 or MIT rule of the project (the Redmond effect LoRAs)
  - repo: berkerdooo/qwen-image-edit-2511-camera-angle-lora
    reason: trained on CC-BY Objaverse data, with an attribution list
  - repo: dx8152/Qwen-Edit-2509-Multiple-angles
    reason: made for Qwen-Image-Edit-2509, and its card asks business users to pay; the fal LoRA is used instead
