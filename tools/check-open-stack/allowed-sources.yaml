# The Hugging Face repositories a weight of registry/models.lock.yaml may come from.
#
# A lock entry is fetched from its `url` and licensed by its `source`. check-open-stack
# (rule weight-source) refuses an entry whose url is in a refused or unknown repository,
# whose source is not listed with role "source", or whose license differs from the
# license of its source. A mirror (Comfy-Org repackaging) never changes the license: the
# lock follows the source.
#
# Each repository was read on 2026-10-19 at the revision noted (API `cardData.license`,
# the README lines about licensing, and the files at its root). `license_file: false`
# means the license is declared in the card metadata only, with no LICENSE file: true of
# most Hugging Face repositories, and worth stating for the effect LoRAs of Remade-AI.
# Details per weight: docs/EXTENSIONS_ANALYSE.md (part 1) and docs/S1_ANALYSE.md.
